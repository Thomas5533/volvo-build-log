<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Car Build Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;600&amp;display=swap">
<style id="app-style">
:root {
  /* Layout: hero (build name + race-number roundel) / summary strip / sticky section nav / six stacked sections */
  --bg: #ECEFEF;
  --surface: #F8FAFA;
  --sunken: #E1E6E7;
  --ink: #111518;
  --muted: #56626A;
  --line: #C9D1D4;
  --accent: #F2C200;
  --accent-ink: #111518;
  --panel: #161B1E;
  --danger: #B5342A;
  --warn: #9E5C00;
  --ok: #2B7550;
  --slate: #4C6476;
  --on-sem: #FFFFFF;
  --focus: #2563EB;
  --glow: none;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "Martian Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1113; --surface: #161A1D; --sunken: #1F2428; --ink: #E6EAEC; --muted: #97A2A8; --line: #2B3236;
    --accent: #F2C200; --accent-ink: #111518; --panel: #1C2226;
    --danger: #EE6E5E; --warn: #E3A13E; --ok: #5CBF8B; --slate: #8FA7B9; --on-sem: #0E1113; --focus: #7AA7FF;
    --glow: 0 0 10px rgba(242, 194, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1113; --surface: #161A1D; --sunken: #1F2428; --ink: #E6EAEC; --muted: #97A2A8; --line: #2B3236;
  --accent: #F2C200; --accent-ink: #111518; --panel: #1C2226;
  --danger: #EE6E5E; --warn: #E3A13E; --ok: #5CBF8B; --slate: #8FA7B9; --on-sem: #0E1113; --focus: #7AA7FF;
  --glow: 0 0 10px rgba(242, 194, 0, .45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body.no-scroll { overflow: hidden; }
img { max-width: 100%; display: block; }
svg { width: 1em; height: 1em; flex: none; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

/* ---------- Hero ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 40px; align-items: center; padding: 44px 0 32px; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 16px; }
.build-name { font-family: var(--font-display); font-style: italic; font-weight: 900; font-stretch: 125%; text-transform: uppercase; font-size: clamp(2.6rem, 6.2vw, 5.25rem); line-height: .92; letter-spacing: -.015em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.car-line { font-family: var(--font-display); font-weight: 600; font-stretch: 110%; font-size: 1.25rem; margin: 16px 0 0; }
.car-line.placeholder { color: var(--muted); font-weight: 500; }
.about { color: var(--muted); max-width: 58ch; margin: 10px 0 0; }
.hero-actions { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
.hero-visual { position: relative; aspect-ratio: 5 / 4; border-radius: 8px; overflow: hidden; background: var(--panel); isolation: isolate; container-type: inline-size; }
.stripes { position: absolute; inset: 0; background: linear-gradient(112deg, transparent 0 36%, var(--accent) 36% 49%, transparent 49% 53%, var(--accent) 53% 58%, transparent 58%); }
.hero-visual .cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero-visual .cover.broken { display: none; }
.roundel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 52%; aspect-ratio: 1; border-radius: 50%; background: #FAFAF7; color: #111518; display: grid; place-items: center; box-shadow: inset 0 0 0 5px #111518, inset 0 0 0 9px #FAFAF7, 0 10px 30px rgba(0, 0, 0, .35); }
.roundel span { font-family: var(--font-display); font-weight: 900; font-stretch: 88%; line-height: 1; font-size: 5rem; font-size: 25cqi; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.roundel.len-3 span { font-size: 17cqi; }
.roundel.len-4 span { font-size: 13cqi; }
.roundel.unset span { color: #A9B2B6; }
.has-cover .roundel { left: auto; top: auto; right: 16px; bottom: 16px; transform: none; width: 22%; box-shadow: inset 0 0 0 3px #111518, inset 0 0 0 5px #FAFAF7, 0 6px 18px rgba(0, 0, 0, .4); }
.has-cover .roundel span { font-size: 10.5cqi; }
.has-cover .roundel.len-3 span { font-size: 7.5cqi; }
.has-cover .roundel.len-4 span { font-size: 5.6cqi; }

/* ---------- Banner ---------- */
.banner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 20px; padding: 12px 16px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); font-size: 14px; }
.banner p { margin: 0; max-width: 70ch; }

/* ---------- Summary strip ---------- */
.dash { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.dash a { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px 15px; background: var(--surface); text-decoration: none; min-width: 0; }
.dash a:hover { background: var(--sunken); }
.dash .k { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.dash .v { font-family: var(--font-display); font-weight: 800; font-stretch: 125%; font-size: 1.6rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
.dash .s { font-size: 12.5px; color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; }
.bad { color: var(--danger); font-weight: 600; }
@media (max-width: 920px) { .dash { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 520px) { .dash { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- Section nav ---------- */
.secnav { position: sticky; top: 0; z-index: 20; margin-top: 32px; background: var(--bg); background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.secnav-inner { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; max-width: 1120px; margin: 0 auto; padding: 0 14px; }
.secnav-inner::-webkit-scrollbar { display: none; }
.secnav a { flex: none; display: flex; align-items: center; gap: 7px; padding: 14px 8px 11px; text-decoration: none; font-family: var(--font-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; }
.secnav a:hover { color: var(--ink); }
.secnav a[aria-current="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.secnav .count { font-size: 10px; padding: 1px 6px; border-radius: 99px; background: var(--sunken); color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- Sections ---------- */
.sec { padding: 56px 0 8px; scroll-margin-top: 52px; }
.sec.dragging { outline: 2px dashed var(--accent); outline-offset: 8px; border-radius: 4px; }
.sec-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.sec h2 { font-family: var(--font-display); font-weight: 800; font-stretch: 125%; text-transform: uppercase; font-size: clamp(1.35rem, 2.6vw, 1.75rem); line-height: 1.1; margin: 0; display: flex; align-items: center; gap: 12px; text-wrap: balance; }
.sec h2::before { content: ""; flex: none; width: 12px; height: .85em; background: var(--accent); transform: skewX(-20deg); }
.sec-meta { margin: 6px 0 0; color: var(--muted); font-size: 13.5px; }
.sec-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sub { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 500; }
.mini-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.notes { margin: 4px 0 0; color: var(--muted); font-size: 14px; max-width: 65ch; overflow-wrap: anywhere; }
.meta-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.empty { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 26px 24px; color: var(--muted); }
.empty p { margin: 0; max-width: 60ch; }
.empty-inline { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
.none { color: var(--muted); font-size: 13px; }
.tag { display: inline-block; vertical-align: 3px; margin-left: 9px; padding: 1px 6px; border-radius: 3px; border: 1px dashed var(--muted); color: var(--muted); font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 500; font-style: normal; line-height: 1.4; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; cursor: pointer; text-decoration: none; line-height: 1.2; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn svg { width: 14px; height: 14px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { border-color: var(--accent-ink); }
.btn-small { padding: 5px 10px; font-size: 12.5px; }
.btn-danger { color: var(--danger); }
.btn-danger:hover { border-color: var(--danger); }
.btn-danger-solid { background: var(--danger); border-color: var(--danger); color: var(--on-sem); }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; border-radius: 4px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; flex: none; }
.icon-btn:hover { border-color: var(--line); color: var(--ink); background: var(--surface); }
.icon-btn svg { width: 15px; height: 15px; }
.link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; overflow-wrap: anywhere; }
.link:hover { text-decoration-color: var(--ink); }
.link svg { width: 12px; height: 12px; }
.cost { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; }

/* ---------- Designators ---------- */
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--surface); max-width: 100%; }
.seg > button, .seg > label { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; margin: 0; border: 0; border-left: 1px solid var(--line); background: transparent; font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); cursor: pointer; line-height: 1.2; }
.seg > :first-child { border-left: 0; }
.seg > button:hover, .seg > label:hover { color: var(--ink); background: var(--sunken); }
.seg svg { width: 12px; height: 12px; }
.seg .bars { width: 13px; height: 11px; }
.seg > [aria-pressed="true"], .seg > label:has(input:checked) { background: var(--ink); color: var(--bg); }
.seg-importance > .v-high[aria-pressed="true"], .seg-importance > label.v-high:has(input:checked) { background: var(--danger); color: var(--on-sem); }
.seg-importance > .v-medium[aria-pressed="true"], .seg-importance > label.v-medium:has(input:checked) { background: var(--warn); color: var(--on-sem); }
.seg-importance > .v-low[aria-pressed="true"], .seg-importance > label.v-low:has(input:checked) { background: var(--slate); color: var(--on-sem); }
.seg-form input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.seg > label:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: -2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 3px; font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: .03em; text-transform: uppercase; border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap; }
.chip svg { width: 12px; height: 12px; }
.chip .bars { width: 13px; height: 11px; }
.chip-importance.v-high { color: var(--danger); border-color: var(--danger); }
.chip-importance.v-medium { color: var(--warn); border-color: var(--warn); }
.chip-importance.v-low { color: var(--slate); border-color: var(--slate); }

/* ---------- Installed parts ---------- */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.filter { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 5px 12px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.filter:hover { color: var(--ink); border-color: var(--ink); }
.filter svg { width: 12px; height: 12px; }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filter .n { font-family: var(--font-mono); font-size: 10.5px; opacity: .7; }
.parts-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.part { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto auto; gap: 18px; align-items: start; padding: 18px 0; border-bottom: 1px solid var(--line); }
.part-date { display: flex; flex-direction: column; font-family: var(--font-mono); line-height: 1.15; padding-top: 2px; }
.part-date .m, .part-date .y { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.part-date .d { font-family: var(--font-display); font-weight: 800; font-stretch: 125%; font-size: 1.55rem; font-variant-numeric: tabular-nums; }
.part-name { font-size: 1.05rem; font-weight: 700; margin: 0; line-height: 1.3; }
.part-rating { padding-top: 2px; }
@media (max-width: 760px) {
  .part { grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px 14px; }
  .part-rating { grid-column: 2 / -1; grid-row: 2; }
}

/* ---------- Races ---------- */
.races { display: grid; gap: 12px; margin-bottom: 28px; }
.race { position: relative; display: grid; grid-template-columns: 100px minmax(0, 1fr) auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.race-date { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 8px; border-right: 2px dashed var(--line); text-align: center; border-radius: var(--radius) 0 0 var(--radius); }
.race-date::before, .race-date::after { content: ""; position: absolute; right: -9px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.race-date::before { top: -9px; clip-path: inset(50% 0 0 0); }
.race-date::after { bottom: -9px; clip-path: inset(0 0 50% 0); }
.race.upcoming .race-date { background: var(--accent); color: var(--accent-ink); border-right-color: rgba(17, 21, 24, .35); }
.race-date .mon { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; }
.race-date .day { font-family: var(--font-display); font-weight: 900; font-stretch: 125%; font-size: 2.3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.race-date .yr { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .06em; margin-top: 5px; }
.race-body { padding: 16px 18px; min-width: 0; }
.race-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.race h3 { margin: 0; font-size: 1.1rem; font-weight: 700; line-height: 1.3; }
.countdown { font-family: var(--font-mono); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; background: var(--sunken); color: var(--ink); }
.loc { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; margin: 4px 0 0; }
.loc svg { width: 13px; height: 13px; }
.people-row { display: flex; gap: 10px; align-items: baseline; margin-top: 10px; }
.people-row .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); width: 78px; flex: none; }
.people { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.person { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 2px; border-radius: 99px; background: var(--sunken); font-size: 13px; }
.result { margin: 12px 0 0; font-size: 14px; border-left: 3px solid var(--accent); padding-left: 10px; max-width: 65ch; }
.race-edit { padding: 10px 10px 0 0; }
@media (max-width: 600px) {
  .race { grid-template-columns: 74px minmax(0, 1fr); }
  .race-edit { position: absolute; top: 6px; right: 6px; padding: 0; }
  .race-top { padding-right: 30px; }
  .race-date .day { font-size: 1.8rem; }
  .people-row { flex-direction: column; gap: 4px; }
}

/* ---------- Avatars ---------- */
.av { display: inline-grid; place-items: center; border-radius: 50%; background: var(--c, #55606A); color: #fff; font-weight: 700; flex: none; letter-spacing: .02em; }
.av.sm { width: 22px; height: 22px; font-size: 9px; }
.av.lg { width: 52px; height: 52px; font-size: 17px; font-stretch: 112%; }
.av.guest { background: var(--muted); color: var(--bg); }
.c0 { --c: #2F5D7C; } .c1 { --c: #8A3B2E; } .c2 { --c: #3D6A39; } .c3 { --c: #5E4A8A; }
.c4 { --c: #8A5A1F; } .c5 { --c: #24706A; } .c6 { --c: #7D3557; } .c7 { --c: #4B5563; }

/* ---------- Maintenance ---------- */
.mt-list { display: grid; gap: 10px; }
.mt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.mt.overdue { border-left-color: var(--danger); }
.mt.soon { border-left-color: var(--warn); }
.mt.ok { border-left-color: var(--ok); }
.mt-head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.mt h3 { margin: 0; font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
.due { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; margin: 8px 0 0; color: var(--muted); }
.mt.overdue .due { color: var(--danger); font-weight: 600; }
.mt.soon .due { color: var(--warn); font-weight: 600; }
.mt-parts { margin-top: 14px; }
.mt-parts ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.mt-parts li { display: flex; align-items: center; gap: 9px 12px; font-size: 14px; flex-wrap: wrap; }
.tick { display: inline-grid; place-items: center; width: 20px; height: 20px; padding: 0; border: 1.5px solid var(--muted); border-radius: 3px; background: transparent; color: transparent; flex: none; }
button.tick { cursor: pointer; }
button.tick:hover { border-color: var(--ink); }
.tick svg { width: 13px; height: 13px; }
li.have .tick { background: var(--ok); border-color: var(--ok); color: #fff; }
li.have .pname { color: var(--muted); }
.mt-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.done { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 14px; }
.done summary { cursor: pointer; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.done ul { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
.done li { display: flex; gap: 8px 14px; align-items: center; font-size: 14px; flex-wrap: wrap; }
.done .when { font-family: var(--font-mono); font-size: 11px; color: var(--muted); min-width: 110px; }
@media (max-width: 600px) { .mt { grid-template-columns: 1fr; } .mt-actions { flex-direction: row; align-items: center; justify-content: space-between; } }

/* ---------- Future mods ---------- */
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
.mod { display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 16px 14px; min-width: 0; }
.mod-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mod-top .mini-label { margin: 0; }
.mod-name { margin: 0; font-size: 1.12rem; font-weight: 700; line-height: 1.3; }
.mod .meta-row { margin-top: 0; }
.mod .notes { margin: 0; }
.shift { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.led { display: flex; flex-direction: column; gap: 6px; align-items: stretch; text-align: left; background: transparent; border: 0; padding: 0; margin: 0; color: var(--muted); min-width: 0; }
button.led { cursor: pointer; }

        '<div class="people-row"><span class="lbl">Racers</span><div class="people">' + (racers || '<span class="none">None yet</span>') + '</div></div>' +
        '<div class="people-row"><span class="lbl">Attendees</span><div class="people">' + (att || '<span class="none">None yet</span>') + '</div></div>' +

    '</article>';
  }

  /* ---------- Maintenance ---------- */
  function maintenanceSec(edit) {
    var open = state.maintenance.filter(function (m) { return !m.doneOn; }).sort(function (a, b) {
      var da = isISO(a.deadline) ? a.deadline : '9999-99-99';
      var db = isISO(b.deadline) ? b.deadline : '9999-99-99';
      return da.localeCompare(db) || rank(IMPORTANCE, a.importance) - rank(IMPORTANCE, b.importance);
    });
    var done = state.maintenance.filter(function (m) { return m.doneOn; })
      .sort(function (a, b) { return String(b.doneOn).localeCompare(String(a.doneOn)); });
    var overdue = open.filter(function (m) { return isISO(m.deadline) && daysUntil(m.deadline) < 0; }).length;
    var meta = state.maintenance.length ? open.length + ' open' + (overdue ? ' · <span class="bad">' + overdue + ' overdue</span>' : '') + ' · ' + done.length + ' done' : '';
    var actions = edit ? addBtn('Add maintenance', 'add-mt') : '';
    if (!state.maintenance.length) {
      return sec('maintenance', 'Maintenance', meta, actions, emptyState(edit ? 'No maintenance scheduled. Add a task with a deadline and the parts you need for it.' : 'No maintenance scheduled.'));
    }
    var body = open.length
      ? '<div class="mt-list">' + open.map(function (m) { return mtRow(m, edit); }).join('') + '</div>'
      : '<p class="empty-inline">All caught up. Nothing open right now.</p>';
    if (done.length) {
      body += '<details class="done"' + (ui.doneOpen ? ' open' : '') + '><summary>Completed (' + done.length + ')</summary><ul>' + done.map(function (m) {
        return '<li><span class="when">' + esc(fmtDate(m.doneOn)) + '</span><span>' + esc(m.title) + sampleTag(m) + '</span>' +
          (edit ? '<button type="button" class="btn btn-small" data-action="reopen-mt" data-id="' + esc(m.id) + '">Reopen</button>' : '') + '</li>';
      }).join('') + '</ul></details>';
    }
    return sec('maintenance', 'Maintenance', meta, actions, body);
  }
  function mtRow(m, edit) {
    var n = isISO(m.deadline) ? daysUntil(m.deadline) : null;
    var st = n == null ? 'none' : n < 0 ? 'overdue' : n <= 7 ? 'soon' : 'ok';
    var due = n == null ? 'No deadline' : 'Due ' + fmtDate(m.deadline) + ' · ' + (n < 0 ? plural(-n, 'day') + ' overdue' : n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days');
    var parts = m.parts || [];
    var have = parts.filter(function (p) { return p.have; }).length;
    var imp = edit ? designator(IMPORTANCE, m.importance, 'set-mt-importance', m.id, 'importance', 'Importance') : chip(IMPORTANCE, m.importance, 'importance', ' importance');
    var partsHtml = '';
    if (parts.length) {
      partsHtml = '<div class="mt-parts"><p class="mini-label">Parts · ' + have + ' of ' + parts.length + ' on hand</p><ul>' + parts.map(function (p) {
        var tick = edit
          ? '<button type="button" class="tick" aria-pressed="' + !!p.have + '" data-action="toggle-part" data-id="' + esc(m.id) + '" data-value="' + esc(p.id) + '" aria-label="' + esc(p.name) + ' on hand" title="' + (p.have ? 'On hand' : 'Mark as on hand') + '">' + ICON.check + '</button>'
          : '<span class="tick" aria-hidden="true">' + ICON.check + '</span><span class="sr-only">' + (p.have ? 'On hand: ' : 'Needed: ') + '</span>';
        return '<li class="' + (p.have ? 'have' : '') + '">' + tick + '<span class="pname">' + esc(p.name) + '</span>' + linkOut(p.link) + '</li>';
      }).join('') + '</ul></div>';
    }
    return '<article class="mt ' + st + '">' +
      '<div class="mt-main">' +
        '<div class="mt-head"><h3>' + esc(m.title) + sampleTag(m) + '</h3>' + imp + '</div>' +
        '<p class="due">' + esc(due) + '</p>' +
        partsHtml +
        (m.notes ? '<p class="notes">' + esc(m.notes) + '</p>' : '') +
      '</div>' +
      (edit ? '<div class="mt-actions"><button type="button" class="btn btn-small" data-action="done-mt" data-id="' + esc(m.id) + '">' + ICON.check + 'Mark done</button>' + editBtn('edit-mt', m.id, m.title) + '</div>' : '') +
    '</article>';
  }

  /* ---------- Future mods ---------- */
  function shift(f, edit) {
    var idx = rank(PROGRESS, f.progress);
    if (idx === 99) idx = -1;
    return '<div class="shift" role="group" aria-label="Progress">' + PROGRESS.map(function (p, i) {
      var cls = 'led' + (i <= idx ? ' lit' : '') + (i === idx ? ' cur' : '');
      var inner = '<span class="led-bar"></span><span class="led-label">' + esc(p.label) + '</span>';
      return edit
        ? '<button type="button" class="' + cls + '" aria-pressed="' + (i === idx) + '" data-action="set-progress" data-id="' + esc(f.id) + '" data-value="' + p.key + '">' + inner + '</button>'

    }).join('') + '</div>';
  }
  function futureSec(edit) {
    var items = state.future.slice().sort(function (a, b) {

    });
    var planned = items.reduce(function (a, f) { return a + num(f.cost); }, 0);
    var stages = PROGRESS.map(function (p) {

    }).filter(function (x) { return x.n; });
    var meta = items.length ? stages.map(function (x) { return x.n + ' ' + x.label.toLowerCase(); }).join(' · ') + (planned ? ' · ' + esc(money(planned)) + ' estimated' : '') : '';
    var actions = edit ? addBtn('Add future mod', 'add-future') : '';
    if (!items.length) {
      return sec('future', 'Future modifications', meta, actions, emptyState(edit ? 'No future mods yet. Add an idea, link where you’d buy it, and move it from theoretical to awaiting installation.' : 'No future mods planned yet.'));
    }
    var cards = items.map(function (f) {
      var hasCost = typeof f.cost === 'number';

      return '<article class="mod">' +
        '<div class="mod-top"><span class="mini-label">Importance</span>' + (edit ? designator(IMPORTANCE, f.importance, 'set-importance', f.id, 'importance', 'Importance') : chip(IMPORTANCE, f.importance, 'importance')) + '</div>' +
        '<h3 class="mod-name">' + esc(f.name) + sampleTag(f) + '</h3>' +
        '<div><p class="mini-label">Progress</p>' + shift(f, edit) + '</div>' +

        (f.notes ? '<p class="notes">' + esc(f.notes) + '</p>' : '') +

      '</article>';
    }).join('');
    return sec('future', 'Future modifications', meta, actions, '<div class="mods">' + cards + '</div>');
  }

  /* ---------- Photography ---------- */
  function photosSec(edit) {

        '<span><strong>Drop photos here</strong> or choose files</span><span class="hint">' + (caps.mode === 'local' ? 'Photos are stored inside this file, resized to 1800 px on the long side.' : 'JPEG, PNG, WebP or GIF. Big photos are resized to 2400 px on the long side.') + '</span></button>';

          '<img src="' + photoSrc(p) + '" alt="" loading="lazy" decoding="async">' +

      }).join('') + '</div>';

  }

  /* ---------- Contributors ---------- */
  function contactHtml(s) {
    s = String(s || '').trim();
    if (!s) return '';
    if (/^(https?:\/\/|www\.)/i.test(s) && safeUrl(s)) return '<p class="contact">' + linkOut(s) + '</p>';
    return '<p class="contact">' + esc(s) + '</p>';
  }
  function contributorsSec(edit) {
    var cs = state.contributors;
    var actions = edit ? addBtn('Add contributor', 'add-contributor') : '';
    var meta = cs.length ? plural(cs.length, 'person', 'people') : '';
    if (!cs.length) {
      return sec('contributors', 'Contributors', meta, actions, emptyState(edit ? 'No contributors yet. Add the people who drive, wrench, shoot photos and show up. You can then pick them as racers or attendees.' : 'No contributors listed yet.'));
    }
    var cards = cs.map(function (c) {
      var raced = state.races.filter(function (r) { return r.racerIds.indexOf(c.id) >= 0; }).length;

      return '<article class="crew ' + colorClass(c.id) + '">' + avatar(c, 'lg') +
        '<div><h3>' + esc(c.name) + sampleTag(c) + '</h3>' +
          (c.role ? '<p class="role">' + esc(c.role) + '</p>' : '') +
          contactHtml(c.contact) +
          (c.notes ? '<p class="notes">' + esc(c.notes) + '</p>' : '') +
          '<p class="crew-stats">Raced ' + raced + ' · Attended ' + attended + '</p>' +
        '</div>' +
        (edit ? editBtn('edit-contributor', c.id, c.name) : '') +
      '</article>';
    }).join('');
    return sec('contributors', 'Contributors', meta, actions, '<div class="crew-grid">' + cards + '</div>');

  /* ---------- Render ---------- */
  var restoreY = null;
  var io = null;
  function render() {
    var edit = isEditing();
    document.body.classList.toggle('editing', caps.canEdit && !ui.readOnly);
    var c = state.car;
    app.innerHTML =
      '<div class="wrap">' + sampleBanner(edit) + hero(edit) + dash() + '</div>' +
      nav() +
      '<main class="wrap">' + installedSec(edit) + racesSec(edit) + maintenanceSec(edit) + futureSec(edit) + photosSec(edit) + contributorsSec(edit) + '</main>' +
      '<footer class="wrap foot"><span>' + esc(c.name || 'Project car') + (c.model ? ' · ' + esc(c.model) : '') + '</span>' +
        '<span>' + (edit ? (caps.mode === 'local' ? 'You’re editing the copy on your computer. Save the file to keep your changes.' : 'Only you can edit. Anyone with the link sees each change once it saves.') : 'Build log') + '</span></footer>';
    renderStatus();
    observeSections();
    if (restoreY != null) window.scrollTo(0, restoreY);
  }
  function observeSections() {
    if (io) io.disconnect();
    if (!('IntersectionObserver' in window)) return;
    var links = {};
    app.querySelectorAll('.secnav a').forEach(function (a) { links[a.getAttribute('data-sec')] = a; });
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        Object.keys(links).forEach(function (k) { links[k].removeAttribute('aria-current'); });
        var a = links[en.target.id];
        if (a) a.setAttribute('aria-current', 'true');
      });
    }, { rootMargin: '-40% 0px -55% 0px' });
    app.querySelectorAll('section.sec').forEach(function (s) { io.observe(s); });
  }

  /* ---------- Saving ---------- */
  var saveTimer = null, saving = false, dirty = false, deferredSave = false;
  var saveMsg = '', saveState = 'saved', saveNote = '', retried = {};

  function setSaveState(st, note) { saveState = st; saveNote = note || ''; renderStatus(); }
  function renderStatus() {
    var el = $('#status');
    if (!caps.canEdit || ui.readOnly) { el.innerHTML = ''; return; }
    if (ui.preview) {
      el.innerHTML = '<div class="pill preview"><span class="dot"></span><span>Previewing as a visitor</span><button type="button" data-action="toggle-preview">Back to editing</button></div>';
      return;
    }
    if (caps.mode === 'local') {
      var ltxt = saveNote || (localDirty ? 'Not saved to the file yet' : 'No unsaved changes');
      var lcls = localDirty ? (saveState === 'error' ? 'error' : 'pending') : 'saved';
      el.innerHTML = '<div class="pill ' + lcls + '" role="status" title="Ctrl+S or Cmd+S also saves"><span class="dot"></span><span>' + esc(ltxt) + '</span>' +
        (localDirty ? '<button type="button" class="pill-primary" data-action="save-file">Save file</button>' : '') +
        '<button type="button" data-action="toggle-preview">Preview as visitor</button></div>';
      return;
    }
    var txt = saveState === 'saved' ? 'All changes saved'
      : saveState === 'saving' ? 'Saving…'
      : saveState === 'pending' ? (saveNote || 'Unsaved changes…')
      : (saveNote || 'Couldn’t save');
    el.innerHTML = '<div class="pill ' + saveState + '" role="status" title="Anyone with the link sees saved changes. Only you can edit."><span class="dot"></span><span>' + esc(txt) + '</span>' +
      (saveState === 'error' && dirty ? '<button type="button" data-action="retry-save">Retry</button>' : '') +
      '<button type="button" data-action="toggle-preview">Preview as visitor</button></div>';
  }
  function commit(mutate, o) {
    o = o || {};
    if (!isEditing() || saving) return;
    mutate(state);
    state.updatedAt = new Date().toISOString();
    render();
    if (lb.open) renderLightbox();
    if (caps.mode === 'local') { localChanged(); return; }
    queueSave(o.immediate ? 0 : 1200, o.msg);
  }
  function queueSave(delay, msg) {
    dirty = true;
    if (msg) saveMsg = msg;
    clearTimeout(saveTimer);
    saveTimer = null;
    setSaveState('pending');
    if (delay > 0 && modal.open) { deferredSave = true; return; }
    saveTimer = setTimeout(save, delay);
  }
  function buildDocument() {
    var css = $('#app-style').textContent;
    var js = $('#app-script').textContent;
    var data = JSON.stringify(state).replace(/</g, '\\u003c');
    return '<!DOCTYPE html>\n<html lang="en">\n<head>\n' + HEAD + '\n<style id="app-style">' + css + '</style>\n</head>\n<body>\n' + SHELL +
      '\n<script id="build-data" type="application/json">' + data + END_SCRIPT +
      '\n<script id="app-script">' + js + END_SCRIPT + '\n</body>\n</html>\n';
  }
  async function save() {
    saveTimer = null;
    if (saving || !dirty) return;
    if (!caps.artifact) { setSaveState('error', 'Saving isn’t available in this view.'); return; }
    saving = true;
    setSaveState('saving');
    lock('Saving…');
    stashView(saveMsg || 'Saved');
    try { if (/^https:\/\//.test(location.origin)) state.assetBase = location.origin; } catch (e) {}
    var html;
    try { html = buildDocument(); } catch (e) {
      saving = false; unlock(); clearStash();
      setSaveState('error', 'Couldn’t prepare the page to save.');
      return;
    }
    try {
      await caps.artifact.publish(html);
      dirty = false; saveMsg = ''; retried = {};
      setSaveState('saved');
      lock('Saved. Refreshing…');
      // The platform reloads this view to the new version. If that doesn't happen, unlock.
      setTimeout(function () { saving = false; unlock(); clearStash(); }, 15000);
    } catch (err) {
      saving = false; unlock(); clearStash();
      onSaveError(err);
    }
  }
  function onSaveError(err) {
    var code = err && err.code;
    if (code === 'conflict') {
      setSaveState('error', 'Loading a newer version…');
      toast('This page was changed somewhere else, so it’s loading the latest version. Your last change wasn’t saved.', 'err');
      return;
    }
    if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'capability_removed', 'not_declared'].indexOf(code) >= 0) {
      ui.readOnly = true;
      render();
      toast('This view is read-only, so changes can’t be saved here.', 'err');
      return;
    }
    if (code === 'too_large') { setSaveState('error', 'Too much to save. Remove some entries, then retry.'); return; }
    if (code === 'rate_limited' && !retried.rate) {
      retried.rate = true;
      setSaveState('pending', 'Saving again in a few seconds…');
      saveTimer = setTimeout(save, 8000);
      return;
    }
    if ((code === 'upstream_error' || !code) && !retried.up) {
      retried.up = true;
      saveTimer = setTimeout(save, 800 + Math.random() * 1200);
      return;
    }
    setSaveState('error', 'Couldn’t save your changes.');
  }
  function stashView(msg) {
    try {
      sessionStorage.setItem(STASH_KEY, JSON.stringify({
        t: Date.now(), y: window.scrollY, msg: msg,
        ui: { filter: ui.filter, doneOpen: ui.doneOpen },
        lb: lb.open ? lb.index : null
      }));
    } catch (e) {}
  }
  function clearStash() { try { sessionStorage.removeItem(STASH_KEY); } catch (e) {} }
  function readStash() {
    try {
      var raw = sessionStorage.getItem(STASH_KEY);
      if (!raw) return null;
      sessionStorage.removeItem(STASH_KEY);
      var v = JSON.parse(raw);
      return v && Date.now() - v.t < 120000 ? v : null;
    } catch (e) { return null; }
  }
  function lock(text) {
    var el = $('#lock');
    el.innerHTML = '<div class="lock-card"><span class="spin" aria-hidden="true"></span><span>' + esc(text) + '</span></div>';
    el.hidden = false;
  }
  function unlock() { var el = $('#lock'); el.hidden = true; el.innerHTML = ''; }
  function toast(msg, kind) {
    var el = document.createElement('div');
    el.className = 'toast' + (kind === 'err' ? ' err' : '');
    el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(function () { el.remove(); }, kind === 'err' ? 7000 : 3200);
  }

  /* ---------- Editing a downloaded copy ---------- */
  var DRAFT_KEY = 'car-build-log:draft:' + location.pathname;
  var localDirty = false, draftTimer = null, fileHandle = null;
  function canUploadPhotos() { return isEditing() && (caps.mode === 'local' || !!caps.assets); }
  function startLocal() {
    caps.mode = 'local';
    caps.canEdit = true;
    var restored = false;
    try {
      var raw = localStorage.getItem(DRAFT_KEY);
      if (raw) {
        var d = normalize(JSON.parse(raw));
        if (d.updatedAt && d.updatedAt > (state.updatedAt || '')) { state = d; restored = true; localDirty = true; }
        else localStorage.removeItem(DRAFT_KEY);
      }
    } catch (e) {}
    saveState = localDirty ? 'pending' : 'saved';
    render();
    if (restored) toast('Brought back changes you hadn’t saved to the file yet. Use Save file to keep them.');
  }
  function localChanged() {
    localDirty = true;
    saveState = 'pending';
    saveNote = '';
    renderStatus();
    clearTimeout(draftTimer);
    draftTimer = setTimeout(function () {
      try { localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch (e) {}
    }, 400);
  }
  function suggestedName() {
    var n = '';
    try { n = decodeURIComponent(location.pathname.split('/').pop() || ''); } catch (e) {}
    return /\.html?$/i.test(n) ? n : 'project-car-build-log.html';
  }
  async function saveFile() {
    if (caps.mode !== 'local') return;
    var html;
    try { html = buildDocument(); } catch (e) {
      saveState = 'error'; saveNote = 'Couldn’t prepare the file'; renderStatus();
      return;
    }
    var blob = new Blob([html], { type: 'text/html' });
    if (typeof window.showSaveFilePicker === 'function') {
      try {
        if (!fileHandle) {
          fileHandle = await window.showSaveFilePicker({
            suggestedName: suggestedName(),
            types: [{ description: 'Web page', accept: { 'text/html': ['.html', '.htm'] } }]
          });
        }
        var w = await fileHandle.createWritable();
        await w.write(blob);
        await w.close();
        fileSaved('Saved to ' + fileHandle.name);
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return;
        fileHandle = null;
      }
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = suggestedName();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    fileSaved('Downloaded ' + a.download, 'Your browser saved an updated copy named ' + a.download + '. Open that copy next time.');
  }
  function fileSaved(note, longNote) {
    localDirty = false;
    clearTimeout(draftTimer);
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    saveState = 'saved';
    saveNote = note;
    renderStatus();
    toast(longNote || note);
  }
  function readDataUrl(blob) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result)); };
      r.onerror = rej;
      r.readAsDataURL(blob);
    });
  }
  async function embedImage(file) {
    if (file.type === 'image/gif') {
      if (file.size > 4 * 1024 * 1024) throw { code: 'too_large_local' };
      return readDataUrl(file);
    }
    var blob = await prepareImage(file, 1800, true);
    if (!blob || blob.type !== 'image/jpeg') throw { code: 'decode' };
    return readDataUrl(blob);
  }

  /* ---------- Dialogs ---------- */
  var modalCtx = null;
  var downOnBackdrop = false;
  function openModal(opts) {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; deferredSave = true; }
    modalCtx = opts;
    modal.innerHTML = '<form class="modal-form" id="modal-form">' +
      '<div class="modal-head"><h2 id="modal-title">' + esc(opts.title) + '</h2><button type="button" class="icon-btn" data-close aria-label="Close">' + ICON.close + '</button></div>' +
      '<div class="modal-body">' + opts.body + '</div>' +
      '<div class="modal-foot">' + (opts.onDelete ? '<button type="button" class="btn btn-danger" data-delete>' + ICON.trash + esc(opts.deleteLabel || 'Delete') + '</button>' : '') +
        '<span class="spacer"></span><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn btn-primary">' + esc(opts.submitLabel || 'Save') + '</button></div>' +

      confirmEl.innerHTML = '<div class="confirm-body"><h2 id="confirm-title">' + esc(o.title || 'Delete this?') + '</h2>' + (o.text ? '<p>' + esc(o.text) + '</p>' : '') + '</div>' +
        '<div class="modal-foot"><span class="spacer"></span><button type="button" class="btn" data-no>Cancel</button>' +
        '<button type="button" class="btn ' + (o.danger === false ? 'btn-primary' : 'btn-danger-solid') + '" data-yes>' + esc(o.ok || 'Delete') + '</button></div>';
      var done = false;
      function finish(v) {
        if (done) return;
        done = true;
        confirmEl.removeEventListener('click', onClick);
        confirmEl.removeEventListener('close', onClose);
        if (confirmEl.open) confirmEl.close();
        resolve(v);

      function onClick(e) {
        if (e.target.closest('[data-yes]')) finish(true);
        else if (e.target.closest('[data-no]') || e.target === confirmEl) finish(false);
      }
      function onClose() { finish(false); }
      confirmEl.addEventListener('click', onClick);

  /* ---------- Photos ---------- */
  async function prepareImage(file, maxSide, force) {
    if (file.type === 'image/gif') return file;
    var MAX = maxSide || 2400;
    var url = null;
    try {
      url = URL.createObjectURL(file);
      var img = await new Promise(function (res, rej) {
        var im = new Image();
        im.onload = function () { res(im); };
        im.onerror = rej;
        im.src = url;
      });
      var w = img.naturalWidth, h = img.naturalHeight;
      if (!w || !h) return file;
      var scale = Math.min(1, MAX / Math.max(w, h));
      if (!force && scale === 1 && ACCEPTED.indexOf(file.type) >= 0 && file.size <= 3 * 1024 * 1024) return file;
      var cw = Math.round(w * scale), ch = Math.round(h * scale);
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, cw, ch);
      var blob = await new Promise(function (res) { canvas.toBlob(res, 'image/jpeg', force ? 0.82 : 0.86); });
      return blob && blob.size ? blob : file;
    } catch (e) {
      return file;
    } finally {
      if (url) URL.revokeObjectURL(url);
    }
  }
  function guessType(name) {
    var m = /\.([a-z0-9]+)$/i.exec(name || '');
    var ext = m ? m[1].toLowerCase() : '';
    return { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp' }[ext];
  }
  function uploadError(failed) {
    var f = failed[0];
    var why = {
      too_large: 'it’s over 20 MB',
      unsupported_type: 'that file type isn’t supported (convert HEIC photos to JPEG first)',
      quota_or_state: 'this page’s photo storage is full',
      rate_limited: 'too many uploads at once, so try again in a minute',
      decode: 'that photo couldn’t be read (convert HEIC photos to JPEG first)',
      too_large_local: 'GIFs over 4 MB are too big to store in the file'
    }[f.code] || 'the upload didn’t go through';
    return failed.length === 1 ? 'Couldn’t upload ' + f.name + ': ' + why + '.' : failed.length + ' photos didn’t upload. ' + f.name + ': ' + why + '.';
  }
  async function handleFiles(fileList) {
    var files = Array.prototype.filter.call(fileList || [], function (f) {
      return /^image\//.test(f.type) || /\.(jpe?g|png|gif|webp|heic|heif)$/i.test(f.name);
    });
    if (!canUploadPhotos() || saving) return;
    if (!files.length) { toast('Choose image files to upload.', 'err'); return; }
    var added = [], failed = [];
    for (var i = 0; i < files.length; i++) {
      lock(files.length > 1 ? 'Adding photo ' + (i + 1) + ' of ' + files.length + '…' : 'Adding photo…');
      try {
        if (caps.mode === 'local') {
          added.push({ id: uid(), src: await embedImage(files[i]), caption: '', added: todayISO() });
        } else {
          var blob = await prepareImage(files[i]);
          var type = ACCEPTED.indexOf(blob.type) >= 0 ? null : guessType(files[i].name);
          var res = await caps.assets.upload(blob, type ? { type: type } : undefined);
          added.push({ id: res.id, caption: '', added: todayISO() });
        }
      } catch (e) {
        failed.push({ name: files[i].name, code: e && e.code });
        if (e && ['quota_or_state', 'rate_limited', 'not_granted', 'capability_disabled'].indexOf(e.code) >= 0) break;
      }
    }
    unlock();
    if (failed.length) toast(uploadError(failed), 'err');
    if (added.length) {
      commit(function (s) { s.photos = added.concat(s.photos); }, { immediate: true, msg: added.length === 1 ? 'Photo added' : added.length + ' photos added' });
    }
  }

  /* ---------- Lightbox ---------- */
  function openLightbox(i, play) {
    if (!state.photos.length) return;
    lb.open = true;
    lb.index = Math.max(0, Math.min(i || 0, state.photos.length - 1));
    document.body.classList.add('no-scroll');
    renderLightbox();
    if (play) startPlay();
    var c = lbEl.querySelector('[data-action="lb-close"]');
    if (c) c.focus();
  }
  function closeLightbox() {
    stopPlay();
    lb.open = false;
    lbEl.hidden = true;
    lbEl.innerHTML = '';
    document.body.classList.remove('no-scroll');
  }
  function lbStep(d) {
    var n = state.photos.length;
    if (!n) return;
    lb.index = (lb.index + d + n) % n;
    renderLightbox();
  }
  function startPlay() {
    stopPlay();
    if (state.photos.length < 2) return;
    lb.playing = true;
    lb.timer = setInterval(function () { lbStep(1); }, 4000);
    renderLightbox();
  }
  function stopPlay() { lb.playing = false; clearInterval(lb.timer); lb.timer = null; }
  function renderLightbox() {
    if (!lb.open) return;
    var n = state.photos.length;
    if (!n) { closeLightbox(); return; }
    if (lb.index >= n) lb.index = n - 1;
    var active = document.activeElement && lbEl.contains(document.activeElement) ? document.activeElement.getAttribute('data-action') : null;
    var p = state.photos[lb.index];
    var edit = isEditing();
    var isCover = state.car.coverPhotoId === p.id;
    lbEl.hidden = false;
    lbEl.innerHTML = '<div class="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">' +
      '<div class="lb-top"><span class="lb-count">' + pad(lb.index + 1) + ' / ' + pad(n) + '</span><div class="lb-tools">' +
        (n > 1 ? '<button type="button" class="lb-btn" data-action="lb-play">' + (lb.playing ? ICON.pause + 'Pause' : ICON.play + 'Slideshow') + '</button>' : '') +
        '<button type="button" class="lb-btn" data-action="lb-close" aria-label="Close photo viewer">' + ICON.close + '</button></div></div>' +
      '<figure class="lb-stage"><img src="' + photoSrc(p) + '" alt="' + esc(p.caption || 'Build photo ' + (lb.index + 1)) + '">' +
        '<figcaption>' + (p.caption ? '<span>' + esc(p.caption) + '</span>' : '') + (isISO(p.added) ? '<span class="lb-date">Added ' + esc(fmtDate(p.added)) + '</span>' : '') + '</figcaption></figure>' +
      (n > 1 ? '<button type="button" class="lb-nav prev" data-action="lb-prev" aria-label="Previous photo">' + ICON.prev + '</button><button type="button" class="lb-nav next" data-action="lb-next" aria-label="Next photo">' + ICON.next + '</button>' : '') +
      (edit
        ? '<div class="lb-owner"><button type="button" class="lb-btn" data-action="lb-caption">' + ICON.edit + (p.caption ? 'Edit caption' : 'Add caption') + '</button>' +
          '<button type="button" class="lb-btn" data-action="lb-cover"' + (isCover ? ' disabled' : '') + '>' + (isCover ? 'This is the cover photo' : 'Use as cover') + '</button>' +
          '<button type="button" class="lb-btn danger" data-action="lb-delete">' + ICON.trash + 'Delete</button></div>'
        : '<div></div>') +
    '</div>';
    if (active) {
      var b = lbEl.querySelector('[data-action="' + active + '"]');
      if (b) b.focus();
    }
  }
  function captionForm() {
    var p = state.photos[lb.index];
    if (!p) return;
    stopPlay();
    renderLightbox();
    var id = p.id;
    openModal({
      title: 'Photo caption',
      body: fText('f-caption', 'Caption', p.caption, { placeholder: 'What’s happening in this shot?' }),
      onSubmit: function (form) {
        var v = getter(form);
        commit(function (s) { var ph = find(s.photos, id); if (ph) ph.caption = v('f-caption'); }, { immediate: true, msg: 'Caption saved' });
      }
    });
  }
  function deletePhoto() {
    var p = state.photos[lb.index];
    if (!p) return;
    stopPlay();
    var id = p.id;
    confirmBox({ title: 'Delete this photo?', text: 'It will be removed from the page for everyone. This can’t be undone.' }).then(async function (ok) {
      if (!ok) return;
      if (caps.mode === 'hosted' && caps.assets && !p.src) { try { await caps.assets.delete(id); } catch (e) { /* still remove it from the page */ } }
      commit(function (s) {
        s.photos = s.photos.filter(function (x) { return x.id !== id; });
        if (s.car.coverPhotoId === id) s.car.coverPhotoId = '';
      }, { immediate: true, msg: 'Photo deleted' });
      if (!state.photos.length) closeLightbox(); else renderLightbox();
    });
  }

  /* ---------- Events ---------- */
  var ACTIONS = {
    'edit-car': function () { carForm(); },
    'remove-samples': function () { removeSamples(); },
    'add-installed': function () { installedForm(); },
    'edit-installed': function (id) { var it = find(state.installed, id); if (it) installedForm(it); },
    'set-rating': function (id, v) { setField('installed', id, 'rating', v); },
    'filter': function (id, v) { ui.filter = v; render(); },
    'add-race': function () { raceForm(); },
    'edit-race': function (id) { var it = find(state.races, id); if (it) raceForm(it); },
    'add-mt': function () { mtForm(); },
    'edit-mt': function (id) { var it = find(state.maintenance, id); if (it) mtForm(it); },
    'set-mt-importance': function (id, v) { setField('maintenance', id, 'importance', v); },
    'toggle-part': function (id, v) {
      commit(function (s) {
        var m = find(s.maintenance, id);
        var p = m && find(m.parts, v);
        if (p) p.have = !p.have;
      });
    },
    'done-mt': function (id) { commit(function (s) { var m = find(s.maintenance, id); if (m) m.doneOn = todayISO(); }, { msg: 'Marked done' }); },
    'reopen-mt': function (id) { commit(function (s) { var m = find(s.maintenance, id); if (m) m.doneOn = ''; }, { msg: 'Reopened' }); },
    'add-future': function () { futureForm(); },
    'edit-future': function (id) { var it = find(state.future, id); if (it) futureForm(it); },
    'set-progress': function (id, v) { setField('future', id, 'progress', v); },
    'set-importance': function (id, v) { setField('future', id, 'importance', v); },
    'install-mod': function (id) { var it = find(state.future, id); if (it) installedForm(null, it); },
    'pick-photos': function () { var i = $('#photo-input'); if (i) i.click(); },
    'open-photo': function (id, v) { openLightbox(parseInt(v, 10) || 0, false); },
    'play': function () { openLightbox(0, true); },
    'add-contributor': function () { contributorForm(); },
    'edit-contributor': function (id) { var it = find(state.contributors, id); if (it) contributorForm(it); },
    'toggle-preview': function () { ui.preview = !ui.preview; render(); if (lb.open) renderLightbox(); },
    'retry-save': function () { retried = {}; save(); },
    'save-file': function () { saveFile(); },
    'lb-prev': function () { lbStep(-1); if (lb.playing) startPlay(); },
    'lb-next': function () { lbStep(1); if (lb.playing) startPlay(); },
    'lb-close': function () { closeLightbox(); },
    'lb-play': function () { if (lb.playing) { stopPlay(); renderLightbox(); } else startPlay(); },
    'lb-caption': function () { captionForm(); },
    'lb-cover': function () {
      var p = state.photos[lb.index];
      if (p) commit(function (s) { s.car.coverPhotoId = p.id; }, { immediate: true, msg: 'Cover photo set' });
    },
    'lb-delete': function () { deletePhoto(); }
  };
  function setField(coll, id, field, value) {
    var item = find(state[coll], id);
    if (!item || item[field] === value) return;
    commit(function (s) { var it = find(s[coll], id); if (it) it[field] = value; });
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('[data-action]');
    if (!t || modal.contains(t) || confirmEl.contains(t)) return;
    var fn = ACTIONS[t.getAttribute('data-action')];
    if (!fn) return;
    e.preventDefault();
    fn(t.getAttribute('data-id'), t.getAttribute('data-value'), t);
  });
  app.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'photo-input') {
      var files = Array.prototype.slice.call(e.target.files || []);
      e.target.value = '';
      handleFiles(files);
    }
  });
  app.addEventListener('toggle', function (e) {
    if (e.target && e.target.matches && e.target.matches('details.done')) ui.doneOpen = e.target.open;
  }, true);
  function dropZone(e) { return e.target && e.target.closest ? e.target.closest('#photos') : null; }
  function hasFiles(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0; }
  document.addEventListener('dragover', function (e) {
    var z = dropZone(e);
    if (z && hasFiles(e) && canUploadPhotos()) { e.preventDefault(); z.classList.add('dragging'); }
  });
  document.addEventListener('dragleave', function (e) {
    var z = dropZone(e);
    if (z && !z.contains(e.relatedTarget)) z.classList.remove('dragging');
  });
  document.addEventListener('drop', function (e) {
    var z = dropZone(e);
    if (!z || !hasFiles(e)) return;
    e.preventDefault();
    z.classList.remove('dragging');
    if (canUploadPhotos()) handleFiles(e.dataTransfer.files);
  });
  document.addEventListener('keydown', function (e) {
    if (!lb.open || modal.open || confirmEl.open) return;
    if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
    else if (e.key === 'ArrowRight') { lbStep(1); if (lb.playing) startPlay(); }
    else if (e.key === 'ArrowLeft') { lbStep(-1); if (lb.playing) startPlay(); }
  });
  document.addEventListener('keydown', function (e) {
    if (caps.mode === 'local' && (e.ctrlKey || e.metaKey) && !e.altKey && String(e.key).toLowerCase() === 's') {
      e.preventDefault();
      saveFile();
    }
  });
  window.addEventListener('beforeunload', function (e) {
    if (caps.mode === 'local' && localDirty) { e.preventDefault(); e.returnValue = ''; }
  });
  var touchX = null;
  lbEl.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
  lbEl.addEventListener('touchend', function (e) {
    if (touchX == null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 50) { lbStep(dx < 0 ? 1 : -1); if (lb.playing) startPlay(); }
  });
  document.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'IMG') t.classList.add('broken');
  }, true);

  /* ---------- Capabilities ---------- */
  async function initCaps() {
    var c = window.claude;
    if ((!c || typeof c.use !== 'function') && location.protocol === 'file:') { startLocal(); return; }
    if (!c || typeof c.use !== 'function') {
      await new Promise(function (r) {
        if (document.readyState === 'complete') setTimeout(r, 300);
        else window.addEventListener('load', function () { setTimeout(r, 50); }, { once: true });
      });
      c = window.claude;
      if (!c || typeof c.use !== 'function') { if (location.hash === '#edit') startLocal(); return; }
    }
    function use(name) {
      try { return Promise.resolve(c.use(name)).catch(function () { return null; }); }
      catch (e) { return Promise.resolve(null); }
    }
    var got = await Promise.all([use('artifact'), use('user')]);
    caps.artifact = got[0];
    caps.user = got[1];
    var can = false;
    if (caps.artifact && caps.user && typeof caps.user.canEdit === 'function') {
      try { can = !!(await caps.user.canEdit()); } catch (e) { can = false; }
    }
    if (!can) return;
    caps.assets = await use('assets');
    caps.mode = 'hosted';
    caps.canEdit = true;
    render();
    if (lb.open) renderLightbox();
  }

  /* ---------- Boot ---------- */
  var stash = readStash();
  if (stash) {
    restoreY = typeof stash.y === 'number' ? stash.y : null;
    if (stash.ui) {
      if (typeof stash.ui.filter === 'string') ui.filter = stash.ui.filter;
      ui.doneOpen = !!stash.ui.doneOpen;
    }
  }
  render();
  if (stash && stash.msg) toast(stash.msg);
  if (stash && typeof stash.lb === 'number' && state.photos.length) openLightbox(stash.lb, false);
  if (restoreY != null) {
    setTimeout(function () { restoreY = null; }, 3000);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (restoreY != null) window.scrollTo(0, restoreY); });
  } else if (location.hash) {
    var target = document.getElementById(location.hash.slice(1));
    if (target) setTimeout(function () { target.scrollIntoView(); }, 0);
  }
  initCaps();
})();
</script>
</body>
</html>
